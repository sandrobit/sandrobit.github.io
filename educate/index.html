<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathématique 4e année</title>
<style>
  :root{
    --paper:#FBF6EC;
    --ink:#26363F;
    --teal:#2C7A73;
    --teal-dark:#1D5A54;
    --coral:#E8603C;
    --gold:#E3A72E;
    --plum:#6B4FA3;
    --line:#D9CFB8;
    --wrong:#C4453A;
    --accent:#2C7A73;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(44,122,115,0.07), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(232,96,60,0.08), transparent 40%),
      var(--paper);
    font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .sheet{ width:100%; max-width:640px; }

  .header{
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:10px;
  }
  .header h1{ font-size:1.45rem; margin:0 0 4px; letter-spacing:-0.01em; }
  .header p{
    margin:0;
    font-family:'Courier New', Consolas, monospace;
    font-size:0.78rem;
    color:var(--teal-dark);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .badge{
    font-family:'Courier New', Consolas, monospace;
    font-size:0.72rem;
    background:var(--ink);
    color:var(--paper);
    padding:6px 10px;
    border-radius:4px;
    white-space:nowrap;
  }

  /* Menu */
  .menu-intro{ margin:0 0 6px; line-height:1.5; font-size:1.02rem; }
  .daydate{
    margin:0 0 18px; font-family:'Courier New', Consolas, monospace; font-size:0.85rem;
    color:var(--coral); font-weight:700;
  }
  .menu{ display:grid; gap:14px; }
  .mcard{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    display:flex;
    gap:14px;
    align-items:center;
    background:#fff;
    border:2px solid var(--ink);
    border-left:10px solid var(--accent);
    border-radius:12px;
    padding:16px 16px;
    box-shadow:4px 4px 0 rgba(38,54,63,0.12);
    transition:transform .08s ease;
  }
  .mcard:hover{ transform:translate(-1px,-1px); }
  .mcard:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .micon{
    font-size:1.9rem; width:48px; height:48px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    flex:none; font-weight:700;
  }
  .mtitle{ font-weight:700; font-size:1.1rem; }
  .mdesc{ font-size:0.9rem; color:#5C5646; margin-top:2px; }
  .mscore{ font-family:'Courier New', Consolas, monospace; font-size:0.78rem; color:var(--teal-dark); margin-top:4px; }

  /* Progress */
  .trail{ display:flex; gap:6px; margin-bottom:24px; }
  .dot{ flex:1; height:8px; border-radius:4px; background:var(--line); }
  .dot.done{ background:var(--accent); }
  .dot.current{ background:var(--gold); }

  /* Card */
  .card{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    box-shadow:6px 6px 0 rgba(38,54,63,0.12);
    padding:28px 24px;
  }
  .qnum{
    font-family:'Courier New', Consolas, monospace;
    font-size:0.85rem;
    color:var(--coral);
    font-weight:700;
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  .qtext{ font-size:1.15rem; line-height:1.6; margin:0 0 20px; }
  .visual{ display:flex; justify-content:center; margin:0 0 18px; }

  .answer-row{ display:flex; gap:10px; flex-wrap:wrap; }
  input[type="text"]{
    flex:1; min-width:150px;
    font-family:'Courier New', Consolas, monospace;
    font-size:1.05rem;
    padding:12px 14px;
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  input[type="text"]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(44,122,115,0.18); }
  button.btn{
    font-family:inherit;
    font-weight:600;
    font-size:1rem;
    padding:12px 20px;
    border-radius:8px;
    border:2px solid var(--ink);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  button.btn:hover{ filter:brightness(0.92); }
  button.btn:disabled{ opacity:0.5; cursor:default; }
  button.btn.ghost{ background:#fff; color:var(--ink); }
  button.btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  .choices{ display:grid; gap:10px; }
  .choice{
    font-family:inherit; font-size:1.02rem; text-align:left;
    padding:13px 14px; border:2px solid var(--ink); border-radius:10px;
    background:var(--paper); color:var(--ink); cursor:pointer;
  }
  .choice:hover{ background:#fff; }
  .choice.bad{ opacity:0.45; text-decoration:line-through; cursor:default; }
  .choice.good{ background:#DDF0EC; border-color:var(--teal); }

  .feedback{ margin-top:16px; font-size:0.98rem; line-height:1.5; min-height:22px; }
  .feedback.ok{ color:var(--teal-dark); }
  .feedback.no{ color:var(--wrong); }
  .note{
    margin-top:10px; padding:10px 12px; background:var(--paper);
    border-left:4px solid var(--gold); border-radius:4px; font-size:0.95rem; line-height:1.5; color:var(--ink);
  }
  .actions{ margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
  .back{ margin-top:18px; text-align:center; }
  .back button{ background:none; border:none; font-family:inherit; color:#7A7362; cursor:pointer; text-decoration:underline; font-size:0.9rem; }

  .final{ text-align:center; }
  .final .stars{ font-size:2.2rem; margin-bottom:6px; }
  .final h2{ margin:0 0 8px; font-size:1.4rem; }
  .final p{ color:#5C5646; line-height:1.5; }
  .score-pill{
    display:inline-block; margin:14px 0;
    background:var(--paper); border:2px solid var(--ink); border-radius:20px; padding:8px 16px;
    font-family:'Courier New', Consolas, monospace; font-size:0.9rem;
  }
  .final .actions{ justify-content:center; }

  .footer-note{
    margin-top:18px; text-align:center; font-size:0.78rem; color:#9A9380;
    font-family:'Courier New', Consolas, monospace;
  }

  /* Fractions écrites */
  .frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; margin:0 2px; font-weight:700; color:var(--teal-dark); }
  .frac .num{ border-bottom:2px solid currentColor; padding:0 3px 1px; }
  .frac .den{ padding:1px 3px 0; }

  /* Barre de fraction */
  .bar{ display:flex; width:min(320px,100%); height:54px; border:3px solid var(--ink); border-radius:6px; overflow:hidden; }
  .bar span{ flex:1; border-right:3px solid var(--ink); background:#fff; }
  .bar span:last-child{ border-right:none; }
  .bar span.on{ background:var(--gold); }

  /* Pièces */
  .coins{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; max-width:360px; }
  .coin{
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-weight:700; color:#26363F;
    border:3px solid #7d8790; box-shadow:inset 0 0 0 3px rgba(255,255,255,0.5);
    font-size:0.85rem;
  }
  .coin.c5{ width:38px; height:38px; background:#C9CED2; }
  .coin.c10{ width:34px; height:34px; background:#D9DDE0; font-size:0.78rem; }
  .coin.c25{ width:44px; height:44px; background:#CBD0D4; }
  .coin.c100{ width:56px; height:56px; background:#E8C45A; border-color:#A8842A; font-size:1rem; }
  .coin.c200{ width:62px; height:62px; background:#E8C45A; border-color:#8d959c; box-shadow:inset 0 0 0 9px #D5DADD; font-size:1.05rem; }


  /* Chronomètre */
  .timebar{
    display:none; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    margin:-8px 0 18px; padding:9px 14px; background:#fff; border:2px solid var(--ink); border-radius:10px;
    font-family:'Courier New', Consolas, monospace; font-size:0.9rem;
  }
  .timebar b{ font-size:1.05rem; color:var(--teal-dark); }
  .timebar .prac{ color:#7A7362; font-size:0.8rem; }

  /* Temps total (accueil) */
  .totalbox{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    margin:0 0 16px; padding:12px 16px; background:#fff; border:2px solid var(--ink); border-radius:12px;
  }
  .tlabel{ font-size:0.8rem; color:#5C5646; text-transform:uppercase; letter-spacing:0.06em; font-family:'Courier New', Consolas, monospace; }
  .tval{ font-size:1.6rem; font-weight:700; font-family:'Courier New', Consolas, monospace; color:var(--teal-dark); }
  .tcount{ font-size:0.92rem; color:#5C5646; }

  /* Coche de réussite */
  .mcard.done{ border-left-color:#2E9E5B; }
  .check{
    margin-left:auto; flex:none; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .check.ok{ background:#2E9E5B; }
  .check.ok svg{ width:22px; height:22px; }
  .check.todo{ border:2px dashed #C9BFA6; }

  .banner{
    margin:0 0 16px; padding:14px 16px; background:#DDF0EC; border:2px solid #2E9E5B; border-radius:12px;
    line-height:1.5;
  }
  .banner .actions{ margin-top:10px; }
  .menu-actions{ margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; }

  /* Nom et classement */
  .namefield{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .sumlist{ list-style:none; margin:14px 0 0; padding:0; text-align:left; font-size:0.98rem; line-height:1.9; }
  .sumlist li{ display:flex; justify-content:space-between; gap:12px; border-bottom:1px dashed var(--line); }
  .sumlist li.total{ border-bottom:none; font-weight:700; border-top:2px solid var(--ink); margin-top:4px; }
  .lbhead{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .lbhead h2{ margin:0; font-size:1.3rem; }
  .sorts{ display:flex; gap:6px; }
  .sorts button{
    font-family:inherit; font-size:0.85rem; padding:6px 12px; border:2px solid var(--ink); border-radius:16px;
    background:#fff; color:var(--ink); cursor:pointer;
  }
  .sorts button.on{ background:var(--ink); color:#fff; }
  .lbtable{ width:100%; border-collapse:collapse; font-size:0.98rem; }
  .lbtable th{ text-align:left; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#7A7362; padding:6px 8px; border-bottom:2px solid var(--ink); }
  .lbtable td{ padding:9px 8px; border-bottom:1px solid var(--line); }
  .lbtable td.r, .lbtable th.r{ text-align:right; font-family:'Courier New', Consolas, monospace; white-space:nowrap; }
  .lbtable td.rk{ width:42px; font-weight:700; }
  .lbtable tr.me td{ background:#FFF3D1; font-weight:700; }
  .lbempty{ color:#7A7362; line-height:1.5; margin:14px 0; }
  .lbnote{ margin-top:12px; font-size:0.85rem; color:#7A7362; line-height:1.5; }


  .logbox{ margin-top:16px; padding:14px 16px; background:var(--paper); border:2px dashed var(--ink); border-radius:12px; text-align:left; }
  .logbox p{ margin:0 0 4px; color:var(--ink); }
  .final .calc{ font-size:0.88rem; color:#7A7362; margin:-6px 0 10px; }
  .sorts{ flex-wrap:wrap; }
  .totalbox .tval{ font-size:1.45rem; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="sheet">
  <div class="header">
    <div>
      <h1 id="hTitle">Mathématique, 4e année</h1>
      <p id="hSub">Résolution de problèmes</p>
    </div>
    <div class="badge" id="hBadge">Série du jour</div>
  </div>

  <div id="timebar" class="timebar" aria-live="off"></div>
  <div id="trail" class="trail" style="display:none"></div>
  <div id="view"></div>

  <div class="footer-note">Nom : _____________________ &nbsp;&nbsp;·&nbsp;&nbsp; Date : ___________</div>
</div>

<script>
// =====================================================================
//  OUTILS D'AFFICHAGE
// =====================================================================
const NB = ' ';
const fr = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;

function clockSVG(h, m){
  const hourAng = ((h % 12) + m / 60) * 30;
  const minAng = m * 6;
  let ticks = '', nums = '';
  for(let i = 0; i < 60; i++){
    const a = i * 6 * Math.PI / 180;
    const long = i % 5 === 0;
    const r1 = long ? 78 : 82, r2 = 88;
    ticks += `<line x1="${(100 + r1 * Math.sin(a)).toFixed(1)}" y1="${(100 - r1 * Math.cos(a)).toFixed(1)}" x2="${(100 + r2 * Math.sin(a)).toFixed(1)}" y2="${(100 - r2 * Math.cos(a)).toFixed(1)}" stroke="#26363F" stroke-width="${long ? 2.5 : 1}"/>`;
  }
  for(let i = 1; i <= 12; i++){
    const a = i * 30 * Math.PI / 180;
    nums += `<text x="${(100 + 64 * Math.sin(a)).toFixed(1)}" y="${(100 - 64 * Math.cos(a) + 6).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="700" fill="#26363F">${i}</text>`;
  }
  const hand = (ang, len, w, color) =>
    `<line x1="100" y1="100" x2="${(100 + len * Math.sin(ang * Math.PI / 180)).toFixed(1)}" y2="${(100 - len * Math.cos(ang * Math.PI / 180)).toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="Une horloge à aiguilles">
    <circle cx="100" cy="100" r="95" fill="#fff" stroke="#26363F" stroke-width="4"/>
    ${ticks}${nums}${hand(hourAng, 42, 6, '#26363F')}${hand(minAng, 66, 4, '#E8603C')}
    <circle cx="100" cy="100" r="5" fill="#26363F"/></svg>`;
}

function barHTML(n, k){
  let cells = '';
  for(let i = 0; i < n; i++) cells += `<span class="${i < k ? 'on' : ''}"></span>`;
  return `<div class="bar" role="img" aria-label="Une barre partagée en ${n} parts égales">${cells}</div>`;
}

function pieSVG(n, k){
  const cx = 100, cy = 100, r = 90;
  let s = '';
  for(let i = 0; i < n; i++){
    const a0 = (i / n) * 2 * Math.PI - Math.PI / 2;
    const a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    s += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i < k ? '#E3A72E' : '#fff'}" stroke="#26363F" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="Un disque partagé en ${n} parts égales">${s}</svg>`;
}

const COIN_LABEL = { c5:'5 ¢', c10:'10 ¢', c25:'25 ¢', c100:'1 $', c200:'2 $' };
function coinsHTML(list){
  let html = '';
  list.forEach(([kind, count]) => {
    for(let i = 0; i < count; i++) html += `<div class="coin ${kind}">${COIN_LABEL[kind]}</div>`;
  });
  return `<div class="coins" role="img" aria-label="Des pièces de monnaie">${html}</div>`;
}

// =====================================================================
//  ALÉATOIRE À GRAINE : les mêmes questions toute la journée,
//  de nouvelles questions chaque jour
// =====================================================================
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed){
  const f = mulberry32(hashStr(seed));
  return {
    int(a, b){ return a + Math.floor(f() * (b - a + 1)); },
    step(a, b, s){ return a + s * Math.floor(f() * (Math.floor((b - a) / s) + 1)); },
    pick(arr){ return arr[Math.floor(f() * arr.length)]; },
    shuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
  };
}

// ---------- Mise en forme du français ----------
function nf(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
function dec(x, d){ return x.toFixed(d).replace('.', ','); }
function pad(n){ return String(n).padStart(2, '0'); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function money(c){
  const d = Math.floor(c / 100), r = c % 100;
  return (r === 0 ? String(d) : d + ',' + pad(r)) + NB + '$';
}
function cents(c){ return c + NB + '¢'; }
function tf(min){ return Math.floor(min / 60) + NB + 'h' + NB + pad(min % 60); }
function dur(min){
  const h = Math.floor(min / 60), m = min % 60;
  if(h > 0 && m > 0) return h + NB + 'h' + NB + pad(m);
  if(h > 0) return h + NB + (h > 1 ? 'heures' : 'heure');
  return m + NB + 'minutes';
}
function fromMin(x){ return [Math.floor(x / 60), x % 60]; }
function que(name){ return /^[AEIOUYÉÈH]/i.test(name) ? "qu'" + name : 'que ' + name; }
function de(name){ return /^[AEIOUYÉÈH]/i.test(name) ? "d'" + name : 'de ' + name; }
const Q = NB + '?';

const NAMES = [
  {n:'Léa', p:'elle'}, {n:'Sam', p:'il'}, {n:'Zoé', p:'elle'}, {n:'Mathis', p:'il'},
  {n:'Alice', p:'elle'}, {n:'Rémi', p:'il'}, {n:'Maya', p:'elle'}, {n:'Nathan', p:'il'},
  {n:'Camille', p:'elle'}, {n:'Éli', p:'il'}, {n:'Sara', p:'elle'}, {n:'Marc', p:'il'},
  {n:'Jade', p:'elle'}, {n:'Noé', p:'il'}, {n:'Emma', p:'elle'}, {n:'Félix', p:'il'},
  {n:'Chloé', p:'elle'}, {n:'Olivier', p:'il'}, {n:'Anaïs', p:'elle'}, {n:'Théo', p:'il'}
];
function twoNames(R){ const a = R.shuffle(NAMES); return [a[0], a[1]]; }

// =====================================================================
//  EXAMEN DE RÉSOLUTION DE PROBLÈMES (10 par jour)
// =====================================================================
function eHarvest(R){
  const N = R.pick(NAMES), thing = R.pick(['pommes', 'fraises', 'bleuets', 'tomates', 'citrouilles']);
  const a = R.int(800, 3000), b = R.int(300, 2500);
  return {
    type:'num', unit:thing, answer:a + b,
    text:`${N.n} a cueilli ${nf(a)} ${thing} le matin et ${nf(b)} autres l'après-midi. Combien de ${thing} y a-t-il dans son panier à la fin de la journée${Q}`,
    hint:`Pense à ce que tu cherches : le total des deux récoltes.`,
    explain:`On additionne les deux récoltes : ${nf(a)} + ${nf(b)} = ${nf(a + b)}.`
  };
}
function eArena(R){
  const ev = R.pick(['le match', 'le spectacle', 'le concert']);
  const lieu = R.pick(["L'aréna de la ville", "L'amphithéâtre de la région", 'La grande salle du centre culturel']);
  const C = R.int(50, 95) * 100, E = R.int(5, Math.floor((C - 2000) / 25)) * 25 + 300;
  return {
    type:'num', unit:'personnes', answer:C - E,
    text:`${lieu} peut asseoir ${nf(C)} personnes. Samedi, ${nf(E)} sièges sont restés vides pendant ${ev}. Combien de personnes y ont assisté${Q}`,
    hint:`Il faut enlever les sièges vides du nombre de places total.`,
    explain:`${nf(C)} − ${nf(E)} = ${nf(C - E)}.`
  };
}
function eMult(R){
  const it = R.pick(['crayons de couleur', 'autocollants', 'billes', 'cartes de hockey', 'perles']);
  const c = R.pick([['boîte', 'boîtes'], ['sac', 'sacs'], ['paquet', 'paquets']]);
  const a = R.int(12, 48), b = R.int(3, 9);
  return {
    type:'num', unit:it, answer:a * b,
    text:`Chaque ${c[0]} contient ${a} ${it}. Combien de ${it} y a-t-il dans ${b} ${c[1]}${Q}`,
    hint:`${b} ${c[1]} qui contiennent chacun${c[0] === 'boîte' ? 'e' : ''} ${a} ${it}, c'est une multiplication.`,
    explain:`${a} × ${b} : ${Math.floor(a / 10) * 10} × ${b} = ${Math.floor(a / 10) * 10 * b} et ${a % 10} × ${b} = ${(a % 10) * b}, donc ${a * b}.`
  };
}
function eDiv(R){
  const T = R.pick(['Mme Tremblay', 'M. Gagnon', 'Mme Roy', 'M. Bouchard', 'Mme Lavoie']);
  const it = R.pick(['cahiers', 'livres', 'crayons', 'bâtons de colle']);
  const k = R.int(4, 9), q = R.int(6, 15), n = k * q;
  return {
    type:'num', unit:it, answer:q,

//  TEST DE L'HEURE (10 par jour) :
//  4 horloges, 2 additions, 2 soustractions, 2 problèmes mixtes
// =====================================================================
function stepsAdd(s, d){
  const h = Math.floor(d / 60), m = d % 60, out = [];
  let cur = s;
  if(h > 0){ out.push(`${tf(cur)} + ${h} h = ${tf(cur + h * 60)}`); cur += h * 60; }
  if(m > 0){ out.push(`${tf(cur)} + ${m} minutes = ${tf(cur + m)}`); cur += m; }
  return out.join(', puis ');
}
function stepsSub(s, d){
  const h = Math.floor(d / 60), m = d % 60, out = [];
  let cur = s;
  if(h > 0){ out.push(`${tf(cur)} − ${h} h = ${tf(cur - h * 60)}`); cur -= h * 60; }
  if(m > 0){ out.push(`${tf(cur)} − ${m} minutes = ${tf(cur - m)}`); cur -= m; }
  return out.join(', puis ');
}

function clockQ(R, used, mins){
  let h, m, key, tries = 0;
  do { h = R.int(1, 12); m = R.pick(mins); key = h + ':' + m; tries++; } while(used.has(key) && tries < 60);
  used.add(key);
  const big = m / 5, next = h % 12 + 1;
  const base = `Chaque nombre de l'horloge vaut 5 minutes pour la grande aiguille. Compte de 5 en 5 à partir du 12.`;
  const hint = m === 0 ? `Quand la grande aiguille est sur le 12, c'est une heure pile.`
             : m === 30 ? `Quand la grande aiguille est sur le 6, elle a fait la moitié du tour.`
             : m >= 45 ? base + ` Attention : quand les minutes approchent de l'heure suivante, la petite aiguille est tout près du chiffre suivant, mais elle ne l'a pas encore atteint. L'heure est celle que la petite aiguille vient de passer.`
             : m <= 10 ? base + ` Attention : la petite aiguille vient tout juste de dépasser le chiffre de l'heure.`
             : base;
  const explain = m === 0
    ? `La grande aiguille est sur le 12 : c'est une heure pile. La petite aiguille est sur le ${h}. Il est ${h}${NB}h${NB}00.`
    : `La grande aiguille est sur le ${big} : ${big} × 5 = ${m} minutes. La petite aiguille a dépassé le ${h} sans arriver au ${next}. Il est ${h}${NB}h${NB}${pad(m)}.`;
  return {
    type:'time', mod12:true, answer:[h, m], visual:clockSVG(h, m),
    text:R.pick([`Regarde bien l'horloge. Quelle heure indique-t-elle${Q}`, `Quelle heure est-il sur cette horloge${Q}`, `Quelle heure montre cette horloge${Q}`]),
    hint, explain, phs:['ex. : 8h25', 'ex. : 6h40']
  };
}

function buildTime(R){

const FOOD = [
  {a:"d'un gâteau", same:'tout pareil'},
  {a:"d'une pizza", same:'toute pareille'},
  {a:"d'une tarte au sucre", same:'toute pareille'},
  {a:"d'une tablette de chocolat", same:'toute pareille'}
];
function fCompareSame(R){
  const [A, B] = twoNames(R), f = R.pick(FOOD), d = R.int(4, 10);
  let a = R.int(1, d - 1), b = R.int(1, d - 1);
  while(a === b) b = R.int(1, d - 1);
  const mode = R.pick(['plus', 'moins']);
  const winner = (mode === 'plus') === (a > b) ? 0 : 1;
  const opts = R.shuffle([A.n, B.n, 'Autant l\'un que l\'autre']);
  const winName = winner === 0 ? A.n : B.n;
  return {
    type:'choice', options:opts, answer:opts.indexOf(winName),
    text:`${A.n} a mangé ${fr(a, d)} ${f.a}. ${B.n} a mangé ${fr(b, d)} ${f.a} ${f.same}. Qui en a mangé le ${mode}${Q}`,
    hint:`Les deux parts sont de la même grosseur, puisque les gâteaux sont coupés pareil. Compare le nombre de parts mangées.`,
    explain:`Les deux fractions ont le même nombre de parts en tout (${d}). On compare le haut : ${a} et ${b}. C'est ${winName} qui en a mangé le ${mode}.`
  };
}
function fCompareUnit(R){
  const [A, B] = twoNames(R), f = R.pick(FOOD);
  let d1 = R.int(2, 10), d2 = R.int(2, 10);
  while(d1 === d2) d2 = R.int(2, 10);
  const mode = R.pick(['plus', 'moins']);
  const bigger = d1 < d2 ? 0 : 1;   // plus petit dénominateur = plus grosse part
  const winner = mode === 'plus' ? bigger : 1 - bigger;
  const opts = R.shuffle([A.n, B.n, 'Autant l\'un que l\'autre']);
  const winName = winner === 0 ? A.n : B.n;
  return {
    type:'choice', options:opts, answer:opts.indexOf(winName),
    text:`${A.n} a mangé ${fr(1, d1)} ${f.a}. ${B.n} a mangé ${fr(1, d2)} ${f.a} ${f.same}. Qui en a mangé le ${mode}${Q}`,
    hint:`Imagine deux gâteaux identiques, l'un coupé en ${d1} parts, l'autre en ${d2} parts. Où les morceaux sont-ils les plus gros${Q}`,
    explain:`Plus on coupe en beaucoup de parts, plus chaque part est petite. ${fr(1, Math.min(d1, d2))} est plus grand que ${fr(1, Math.max(d1, d2))}. C'est donc ${winName} qui en a mangé le ${mode}.`
  };
}
function fEquiv(R){
  const base = R.pick([[1, 2], [1, 3], [1, 4], [2, 3], [1, 5], [3, 4], [2, 5], [1, 6]]);
  let k; do { k = R.int(2, 4); } while(base[1] * k > 12);
  const n = base[0] * k, d = base[1] * k;
  if(R.int(0, 1) === 0){
    return {
      type:'num', unit:'', answer:n,
      text:`Complète pour que les deux fractions représentent la même quantité : ${fr(base[0], base[1])} = ${fr('?', d)}. Quel nombre remplace le point d'interrogation${Q}`,
      hint:`Si on coupe chaque part en ${k} morceaux égaux, combien de parts de plus obtient-on${Q}`,
      explain:`Le bas passe de ${base[1]} à ${d} : on multiplie par ${k}. Le haut doit aussi être multiplié par ${k} : ${base[0]} × ${k} = ${n}. Donc ${fr(base[0], base[1])} = ${fr(n, d)}.`
    };
  }
  return {
    type:'num', unit:'', answer:d,
    text:`Complète pour que les deux fractions représentent la même quantité : ${fr(base[0], base[1])} = ${fr(n, '?')}. Quel nombre remplace le point d'interrogation${Q}`,
    hint:`Regarde de combien le haut a changé, et fais pareil pour le bas.`,
    explain:`Le haut passe de ${base[0]} à ${n} : on multiplie par ${k}. Le bas doit aussi être multiplié par ${k} : ${base[1]} × ${k} = ${d}. Donc ${fr(base[0], base[1])} = ${fr(n, d)}.`
  };
}

function fOrder(R){
  const d = R.int(6, 12);
  const nums = R.shuffle(Array.from({length:d - 1}, (_, i) => i + 1)).slice(0, 3);
  const mode = R.pick(['grande', 'petite']);
  const target = mode === 'grande' ? Math.max.apply(null, nums) : Math.min.apply(null, nums);
  const opts = nums.map(n => fr(n, d));
  return {
    type:'choice', options:opts, answer:nums.indexOf(target),
    text:`Parmi ces trois fractions, laquelle est la plus ${mode}${Q}`,
    hint:`Les trois fractions ont le même bas. Il suffit de comparer les nombres du haut.`,
    explain:`Les parts ont toutes la même grosseur (${d} parts en tout). La plus ${mode} est celle qui a le ${mode === 'grande' ? 'plus grand' : 'plus petit'} nombre en haut : ${fr(target, d)}.`
  };
}
function buildFractions(R){
  const pool = [fBar, fPie, fComplement, fPizza, fCompareSame, fCompareUnit, fEquiv, fGroup, fGroupK, fAdd, fSub, fOrder];
  return R.shuffle(pool).slice(0, 10).map(g => g(R));
}

function buildQuestions(id, key){
  const R = makeRng(key + '|' + id);
  let qs;
  if(id === 'exam') qs = buildExam(R);
  else if(id === 'time') qs = buildTime(R);

  else qs = buildFractions(R);

  qs.forEach(q => { if(q.phs) q.placeholder = safePh(q, q.phs); });

}
function safePh(q, cands){
  for(let i = 0; i < cands.length; i++){
    const v = cands[i].replace(/^ex\.\s*:\s*/, '');
    if(!checkAnswer(q, v)) return cands[i];
  }
  return cands[cands.length - 1];
}

// =====================================================================
//  VÉRIFICATION DES RÉPONSES
// =====================================================================
const SPACES = /[\s  ]/g;

function parseNum(s){
  let t = String(s).toLowerCase().replace(SPACES, '').replace(',', '.');
  t = t.replace(/[^0-9.\-]/g, '');
  if(t === '' || t === '.' || t === '-') return NaN;
  return parseFloat(t);
}

function parseTime(s){
  let t = String(s).toLowerCase().replace(SPACES, '');
  // Mention facultative : am, a.m., pm, p.m., du matin, de l'après-midi, du soir
  let suf = null;
  const sm = t.match(/(a\.?m\.?|p\.?m\.?|(?:du|de)?matin|(?:du)?soir|(?:de)?l'?apr[eè]s-?midi)$/);
  if(sm){
    suf = /matin|^a\.?m/.test(sm[1]) ? 'am' : 'pm';
    t = t.slice(0, t.length - sm[1].length);
  }
  t = t.replace(/minutes?|min/g, '').replace(/heures?/g, 'h');
  let m = t.match(/^(\d{1,2})(?:[h:](\d{0,2}))?$/);
  if(m){
    const mins = m[2] ? parseInt(m[2], 10) : 0;
    return mins < 60 ? [parseInt(m[1], 10), mins, suf] : null;
  }
  m = t.match(/^(\d{1,2})(\d{2})$/);
  if(m){
    const mins = parseInt(m[2], 10);
    return mins < 60 ? [parseInt(m[1], 10), mins, suf] : null;
  }
  return null;
}

// Erreur fréquente sur les horloges : minutes justes, mais heure décalée de 1
// (ex. : 4 h 55 lu comme 5 h 55, parce que la petite aiguille touche presque le 5)
function clockSlip(q, raw){
  if(q.type !== 'time' || !q.mod12 || q.answer[1] === 0) return null;
  const t = parseTime(raw);
  if(!t || t[1] !== q.answer[1]) return null;
  const hh = q.answer[0], next = hh % 12 + 1, prev = (hh + 10) % 12 + 1;
  const diff = (((t[0] % 12) - (hh % 12)) + 12) % 12;
  if(diff === 1) return `Tu as bien lu les minutes. Regarde la petite aiguille : elle n'a pas encore atteint le ${next}, alors l'heure est encore ${hh}.`;
  if(diff === 11) return `Tu as bien lu les minutes. Regarde la petite aiguille : elle a déjà dépassé le ${hh}, alors l'heure n'est plus ${prev}.`;
  return null;
}

function checkAnswer(q, raw){
  if(q.type === 'num'){
    const n = parseNum(raw);
    if(isNaN(n)) return false;
    if(Math.abs(n - q.answer) < 0.001) return true;
    if(q.alsoCents && Math.abs(n - q.answer * 100) < 0.001) return true;
    return false;
  }
  if(q.type === 'time'){
    const t = parseTime(raw);
    if(!t) return false;
    const h = q.answer[0], m = q.answer[1];
    if(t[1] !== m) return false;
    // Horloge : on ne peut pas voir si c'est le matin ou l'après-midi, donc les deux sont acceptés
    if(q.mod12) return t[0] % 12 === h % 12;
    // Problème à heure précise : on accepte l'heure en 24 h ou en 12 h avec am/pm
    let hh = t[0];
    if(t[2] === 'pm' && hh < 12) hh += 12;
    else if(t[2] === 'am' && hh === 12) hh = 0;
    return hh === h;
  }
  if(q.type === 'frac'){
    const t = String(raw).replace(SPACES, '');
    if(t === q.answer) return true;
    if(q.equiv){
      const m = t.match(/^(\d+)\/(\d+)$/), a = q.answer.split('/');
      if(m && parseInt(m[2], 10) > 0) return parseInt(m[1], 10) * parseInt(a[1], 10) === parseInt(a[0], 10) * parseInt(m[2], 10);
    }
    return false;
  }
  return false;
}

// ---------- Chronomètre ----------
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), r = sec % 60;
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(r);
}
let secStart = 0, ticker = null, practice = false;
function elapsed(){ return Math.max(0, Math.round((Date.now() - secStart) / 1000)); }
function totalDone(){
  let t = 0;
  modules.forEach(m => { const x = saved.scores[m.id]; if(x) t += x.seconds || 0; });
  return t;
}
function doneCount(){ return modules.filter(m => saved.scores[m.id]).length; }
function sumFirst(){ let a = 0, b = 0; modules.forEach(m => { const x = saved.scores[m.id]; if(x){ a += x.firstTry; b += x.total; } }); return [a, b]; }
function updateClock(){
  const a = document.getElementById('tSec'), b = document.getElementById('tTot');
  if(a) a.textContent = fmt(elapsed());
  if(b) b.textContent = fmt(totalDone() + (practice ? 0 : elapsed()));
}
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }
function startTicker(){ stopTicker(); ticker = setInterval(updateClock, 1000); }

// ---------- Classement : partagé si possible, sinon cet appareil ----------
let DB = null, CAN_WRITE = null;
(async function initCaps(){
  try {
    if(window.claude && typeof window.claude.use === 'function'){
      DB = await window.claude.use('db');
      const U = await window.claude.use('user');
      if(U && typeof U.can === 'function') CAN_WRITE = await U.can('data.write');
    }
  } catch(e) { DB = null; }
})();
// ---------- Score : 5 points par question réussie du premier coup, multipliés par un bonus de vitesse ----------
// Bonus : ×2 à 2 min 30 s ou moins, ×1 à 5 min, ×0,5 à 10 min ou plus (entre les deux, proportionnel).
function speedBonus(sec){ return Math.min(2, Math.max(0.5, 300 / Math.max(1, sec))); }
function calcPoints(firstTry, sec){ return Math.round(5 * firstTry * speedBonus(sec)); }
function bonusStr(sec){ return '×' + dec(Math.round(speedBonus(sec) * 100) / 100, 2); }

const LS_KEY = 'math4-scores-v2';
function localRows(){
  try { const a = JSON.parse(localStorage.getItem(LS_KEY)) || []; return a.filter(r => r && r.day === DAY && r.section); } catch(e) { return []; }
}
function setLocal(e){
  try {
    const a = JSON.parse(localStorage.getItem(LS_KEY)) || [];
    const i = a.findIndex(r => r.id === e.id);
    if(i >= 0) a[i] = e; else a.push(e);
    localStorage.setItem(LS_KEY, JSON.stringify(a.slice(-400)));
  } catch(x) {}
}
function cleanName(v){ return String(v).replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20); }
function normRow(id, d){
  return {
    id:id, pid:String(d && d.pid || id), name:cleanName(d && d.name || '') || 'Anonyme',
    section:String(d && d.section || ''), score:Number(d && d.score) || 0,
    seconds:Number(d && d.seconds) || 0, at:Number(d && d.at) || 0, shared:!(d && d.shared === false)
  };
}
function sumPoints(){ let p = 0; modules.forEach(m => { const x = saved.scores[m.id]; if(x) p += x.points || 0; }); return p; }
function loggedCount(){ return modules.filter(m => saved.scores[m.id] && saved.scores[m.id].logged).length; }

// Enregistre le score de chaque section terminée à 100 % (jamais une section abandonnée)
async function logScores(name, ids){
  if(!saved.pid) saved.pid = 'p' + Math.random().toString(36).slice(2, 10);
  saved.name = name;
  for(const id of ids){
    const x = saved.scores[id];
    if(!x || x.logged) continue;
    const docId = DAY + '-' + saved.pid + '-' + id;
    const entry = { pid:saved.pid, name:name, day:DAY, section:id, score:x.points, seconds:x.seconds, firstTry:x.firstTry, total:x.total, at:Date.now() };
    let shared = false;
    try {
      if(DB && CAN_WRITE !== false){ await DB.collection('leaderboard').doc(docId).set(entry); shared = true; }
    } catch(e) { shared = false; }
    x.logged = true; x.shared = shared;
    persist();
    setLocal(Object.assign({ id:docId, shared:shared }, entry));
  }
}

let mod = null;
let idx = 0;
let firstTry = 0;

const hSub = document.getElementById('hSub');

function setAccent(color){ document.documentElement.style.setProperty('--accent', color); }

function renderTrail(){
  trailEl.style.display = 'flex';
  trailEl.innerHTML = '';
  mod.questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx ? ' done' : (i === idx ? ' current' : ''));
    trailEl.appendChild(d);
  });
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let LB_UNSUB = null;
function stopLb(){ if(LB_UNSUB){ try { LB_UNSUB(); } catch(e) {} LB_UNSUB = null; } }
const timebarEl = document.getElementById('timebar');

function showMenu(){

  stopTicker(); stopLb();
  timebarEl.style.display = 'none';
  trailEl.style.display = 'none';
  setAccent('#2C7A73');
  hTitle.textContent = 'Mathématique, 4e année';
  hSub.textContent = 'Résolution de problèmes';
  hBadge.textContent = 'Série du jour';

  const n = doneCount(), all = n === modules.length;

    <p class="daydate">Questions du ${dayLabel(DAY).toLowerCase()}</p>
    <div class="totalbox" id="totalbox">
      <div><div class="tlabel">Temps total</div><div class="tval" id="totalVal">${fmt(totalDone())}</div></div>
      <div><div class="tlabel">Score total</div><div class="tval" id="pointsVal">${sumPoints()} pts</div></div>
      <div class="tcount">${n} sur ${modules.length} sections terminées</div></div>`;
  if(unlogged.length){
    html += `<div class="banner"><strong>${all ? 'Les 4 sections sont terminées ! ' : ''}${unlogged.length === 1 ? 'Tu as 1 score à enregistrer.' : 'Tu as ' + unlogged.length + ' scores à enregistrer.'}</strong>
      <div class="actions"><button class="btn" id="logAllBtn">Enregistrer ${unlogged.length === 1 ? 'mon score' : 'mes scores'}</button></div></div>`;
  } else if(all){
    html += `<div class="banner"><strong>Les 4 sections sont terminées !</strong> Score total : ${sumPoints()} pts.
      <div class="actions"><button class="btn" id="seeLbBtn">Voir le classement</button></div></div>`;
  }
  html += `<div class="menu">`;
  modules.forEach(m => {
    const sc = saved.scores[m.id];
    const score = sc ? `<div class="mscore">Terminé : ${sc.firstTry} sur ${sc.total} du premier coup · ${fmt(sc.seconds)} · ${sc.points} pts${sc.logged ? ' · enregistré' : ''}</div>` : '';
    const mark = sc
      ? `<span class="check ok" role="img" aria-label="Section terminée">${CHECK_SVG}</span>`
      : `<span class="check todo" role="img" aria-label="Section à faire"></span>`;
    html += `<button class="mcard${sc ? ' done' : ''}" data-id="${m.id}" style="--accent:${m.color}">
      <div class="micon">${m.icon}</div>
      <div><div class="mtitle">${m.title}</div><div class="mdesc">${m.desc}</div>${score}</div>${mark}
    </button>`;
  });
  html += `</div><div class="menu-actions" id="menuActions"><button class="btn ghost" id="lbBtn">Voir le classement du jour</button>
    <button class="btn ghost" id="newPupil">Nouvel élève</button></div>`;
  viewEl.innerHTML = html;
  viewEl.querySelectorAll('.mcard').forEach(b => {
    b.addEventListener('click', () => startModule(b.getAttribute('data-id')));
  });
  document.getElementById('lbBtn').addEventListener('click', showLeaderboard);
  const la = document.getElementById('logAllBtn'); if(la) la.addEventListener('click', showLogAll);
  const sl = document.getElementById('seeLbBtn'); if(sl) sl.addEventListener('click', showLeaderboard);
  document.getElementById('newPupil').addEventListener('click', () => {
    const box = document.getElementById('menuActions');
    box.innerHTML = `<p class="lbnote">Effacer la progression de cet appareil pour accueillir un nouvel élève ? Les scores déjà enregistrés restent au classement.</p>
      <button class="btn" id="newYes">Oui, nouvel élève</button> <button class="btn ghost" id="newNo">Annuler</button>`;
    document.getElementById('newNo').addEventListener('click', showMenu);
    document.getElementById('newYes').addEventListener('click', () => {
      saved = { day:DAY, scores:{}, pid:'', name:'' };
      persist(); showMenu();

}

function startModule(id){
  const meta = modules.find(m => m.id === id);
  mod = { id:meta.id, color:meta.color, title:meta.title, questions:buildQuestions(id, DAY) };
  idx = 0;
  firstTry = 0;
  stopLb();
  practice = !!saved.scores[id];
  secStart = Date.now();
  timebarEl.innerHTML = practice
    ? `<span>⏱ Pratique <b id="tSec">00:00</b> <span class="prac">(le score ne change pas)</span></span><span>Total <b id="tTot">${fmt(totalDone())}</b></span>`
    : `<span>⏱ Cette section <b id="tSec">00:00</b></span><span>Total <b id="tTot">${fmt(totalDone())}</b></span>`;
  timebarEl.style.display = 'flex';
  updateClock(); startTicker();
  setAccent(mod.color);
  hTitle.textContent = mod.title;
  hSub.textContent = 'Mathématique, 4e année';
  hBadge.textContent = mod.questions.length + ' questions';
  renderQuestion();
}

function renderQuestion(){
  renderTrail();
  const q = mod.questions[idx];
  const isLast = idx === mod.questions.length - 1;
  let attempts = 0;

  let body = `<div class="card">
    <div class="qnum">QUESTION ${idx + 1} SUR ${mod.questions.length}</div>
    ${q.visual ? `<div class="visual">${q.visual}</div>` : ''}
    <p class="qtext">${q.text}</p>`;

  if(q.type === 'choice'){
    body += `<div class="choices" id="choices">` +
      q.options.map((o, i) => `<button class="choice" data-i="${i}">${o}</button>`).join('') +
      `</div>`;
  } else {
    const ph = q.placeholder || (q.unit ? 'Ta réponse (' + q.unit + ')' : 'Ta réponse');
    body += `<div class="answer-row">
      <input type="text" id="answerInput" placeholder="${ph}" autocomplete="off" ${q.type === 'num' ? 'inputmode="decimal"' : ''}>
      <button class="btn" id="submitBtn">Vérifier</button>
    </div>`;
  }
  body += `<div class="feedback" id="feedback" aria-live="polite"></div><div id="extra"></div></div>
    <div class="back"><button id="backBtn">Retour au menu</button></div>`;
  viewEl.innerHTML = body;

  const feedback = document.getElementById('feedback');
  const extra = document.getElementById('extra');
  document.getElementById('backBtn').addEventListener('click', showMenu);

  function success(){
    if(attempts === 0) firstTry++;
    feedback.className = 'feedback ok';
    feedback.textContent = attempts === 0 ? '✔ Bonne réponse, du premier coup !' : '✔ Bonne réponse ! Tu as persévéré.';
    extra.innerHTML = `<div class="note">${q.explain}</div>
      <div class="actions"><button class="btn" id="nextBtn">${isLast ? 'Voir mes résultats' : 'Question suivante'}</button></div>`;
    const nb = document.getElementById('nextBtn');
    nb.focus();
    nb.addEventListener('click', () => {
      idx++;
      if(idx >= mod.questions.length) renderFinal(); else renderQuestion();
    });
  }

  function failure(raw){
    attempts++;
    feedback.className = 'feedback no';
    const slip = clockSlip(q, raw);
    if(slip && attempts <= 2){
      feedback.textContent = slip;
    } else if(attempts === 1){
      feedback.textContent = 'Pas tout à fait. Relis bien la question et essaie encore !';
    } else if(attempts === 2){
      feedback.innerHTML = 'Pas encore. Un petit coup de pouce : ' + q.hint;
    } else {
      feedback.textContent = 'Pas encore. Regardons ça étape par étape.';
      extra.innerHTML = `<div class="note">${q.explain}</div>`;
    }
  }

  if(q.type === 'choice'){
    document.querySelectorAll('#choices .choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if(btn.classList.contains('bad')) return;
        const i = parseInt(btn.getAttribute('data-i'), 10);
        if(i === q.answer){
          btn.classList.add('good');
          document.querySelectorAll('#choices .choice').forEach(b => b.disabled = true);
          success();
        } else {
          btn.classList.add('bad');
          failure();
        }
      });
    });
  } else {
    const input = document.getElementById('answerInput');
    const btn = document.getElementById('submitBtn');
    input.focus();
    function submit(){
      if(input.value.trim() === ''){
        feedback.className = 'feedback no';
        feedback.textContent = 'Écris une réponse avant de vérifier.';
        return;
      }
      if(checkAnswer(q, input.value)){
        input.disabled = true;
        btn.disabled = true;
        success();
      } else {
        failure(input.value);
        input.select();
      }
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
  }
}

function nameRow(prefill, btnLabel){
  return `<div class="namefield">
      <input type="text" id="nameInput" maxlength="20" placeholder="Ton prénom" autocomplete="off" aria-label="Ton prénom" value="">
      <button class="btn" id="logBtn">${btnLabel}</button></div>
    <div class="feedback" id="logFb" aria-live="polite"></div>`;
}
// Branche le formulaire du nom : onDone() est appelé une fois les scores enregistrés
function wireNameForm(ids, onDone){
  const inp = document.getElementById('nameInput'), btn = document.getElementById('logBtn'), fb = document.getElementById('logFb');
  inp.value = saved.name || '';
  inp.focus();
  let busy = false;
  async function go(){
    if(busy) return;
    const name = cleanName(inp.value);
    if(!name){ fb.className = 'feedback no'; fb.textContent = 'Écris ton prénom pour enregistrer ton score.'; return; }
    busy = true; btn.disabled = true; inp.disabled = true;
    await logScores(name, ids);
    onDone();
  }
  btn.addEventListener('click', go);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

function renderFinal(){
  const total = mod.questions.length;
  const secs = elapsed();
  stopTicker();
  timebarEl.style.display = 'none';
  const wasPractice = practice;
  // Le score se calcule et se range seulement ici : la section est terminée à 100 %
  if(!wasPractice){
    saved.scores[mod.id] = { firstTry:firstTry, total:total, seconds:secs, points:calcPoints(firstTry, secs), logged:false, shared:false };
    persist();
  }
  const rec = saved.scores[mod.id];
  trailEl.style.display = 'flex';
  trailEl.innerHTML = '';
  for(let i = 0; i < total; i++){
    const d = document.createElement('div');
    d.className = 'dot done';
    trailEl.appendChild(d);
  }
  const msg = firstTry === total
    ? 'Un sans-faute du premier coup, bravo !'
    : 'Tu as trouvé toutes les bonnes réponses, même celles qui demandaient plus d\'un essai. C\'est comme ça qu\'on apprend.';
  const n = doneCount(), all = n === modules.length;
  let body;
  if(wasPractice){
    body = `<div class="score-pill">⏱ ${fmt(secs)} · pratique</div><p>Ton score et ton temps du jour pour cette section ne changent pas.</p>`;
  } else {
    body = `<div class="score-pill">⭐ ${rec.points} pts · ⏱ ${fmt(secs)}</div>
       <p class="calc">5 pts × ${firstTry} réussies du premier coup = ${5 * firstTry} · bonus de vitesse ${bonusStr(secs)}</p>
       <p>Temps total : <strong>${fmt(totalDone())}</strong> · Score total : <strong>${sumPoints()} pts</strong> (${n} sur ${modules.length} sections).</p>
       ${all ? '<p><strong>Les 4 sections sont terminées !</strong></p>' : ''}
       <div class="logbox" id="logBox"><p>Enregistre ton score au classement :</p>${nameRow('', 'Enregistrer mon score')}</div>`;
  }
  viewEl.innerHTML = `<div class="card final">
    <div class="stars">🌟</div>
    <h2>Activité terminée</h2>
    <p>${msg}</p>
    ${body}
    <div class="actions">
      <button class="btn ghost" id="menuBtn">Retour au menu</button>
      <button class="btn ghost" id="againBtn">Refaire pour m'exercer</button>
    </div>
  </div>`;
  document.getElementById('againBtn').addEventListener('click', () => startModule(mod.id));
  document.getElementById('menuBtn').addEventListener('click', showMenu);
  if(!wasPractice){
    wireNameForm([mod.id], () => {
      const box = document.getElementById('logBox');
      if(!box) return;
      box.innerHTML = `<p>✔ Score enregistré au classement.</p><div class="actions"><button class="btn" id="seeLb">Voir le classement</button></div>`;
      document.getElementById('seeLb').addEventListener('click', showLeaderboard);
    });
  }
}

// Enregistrer d'un coup les scores des sections terminées mais pas encore inscrites

  timebarEl.style.display = 'none';
  trailEl.style.display = 'none';
  setAccent('#2C7A73');
  hTitle.textContent = 'Enregistrer mes scores';
  hSub.textContent = 'Mathématique, 4e année';

    const x = saved.scores[m.id];
    items += `<li><span>${m.title}</span><span>${x.points} pts · ${fmt(x.seconds)}</span></li>`;
  });
  viewEl.innerHTML = `<div class="card final">
    <div class="stars">🏆</div>
    <h2>Enregistre ton score</h2>
    <ul class="sumlist">${items}</ul>

  </div>`;
  document.getElementById('backMenu').addEventListener('click', showMenu);
  wireNameForm(todo.map(m => m.id), showLeaderboard);
}

let lbTab = 'total';
const SHORT = { exam:'Examen', time:'Heure', money:'Monnaie', fractions:'Fractions' };
function showLeaderboard(){
  stopTicker(); stopLb();
  timebarEl.style.display = 'none';
  trailEl.style.display = 'none';
  setAccent('#2C7A73');
  hTitle.textContent = 'Classement du jour';
  hSub.textContent = 'Mathématique, 4e année';
  hBadge.textContent = 'Série du jour';
  let tabs = `<button data-t="total">Total</button>`;
  modules.forEach(m => { tabs += `<button data-t="${m.id}">${SHORT[m.id]}</button>`; });
  viewEl.innerHTML = `<div class="card">
    <div class="lbhead"><h2>${dayLabel(DAY)}</h2></div>
    <div class="sorts" id="lbTabs">${tabs}</div>
    <div id="lbRows" style="margin-top:12px"></div>
    <div class="lbnote" id="lbFormula">Score = 5 points × questions réussies du premier coup × bonus de vitesse (×2 à 2 min 30 s ou moins, ×1 à 5 min, ×0,5 à 10 min ou plus).</div>
    <div class="lbnote" id="lbNote"></div>
    <div class="actions"><button class="btn" id="lbBack">Retour au menu</button></div>
  </div>`;
  let rows = localRows().map(r => normRow(r.id, r));
  let sharedBoard = false;
  const note = document.getElementById('lbNote');
  function paintNote(){
    let t = sharedBoard
      ? 'Classement partagé : on y voit tous les élèves qui ont enregistré un score aujourd\'hui.'
      : 'Classement de cet appareil seulement.';
    const miss = modules.filter(m => saved.scores[m.id] && saved.scores[m.id].logged && !saved.scores[m.id].shared).length;
    if(miss) t += ' ' + (miss === 1 ? '1 de tes scores est enregistré ici, mais n\'a' : miss + ' de tes scores sont enregistrés ici, mais n\'ont') + ' pas pu être partagé' + (miss === 1 ? '' : 's') + ' avec la classe.';
    note.textContent = t;
  }
  function paintRows(){
    document.querySelectorAll('#lbTabs button').forEach(b => { b.className = b.getAttribute('data-t') === lbTab ? 'on' : ''; });
    const box = document.getElementById('lbRows');
    if(!box) return;
    let list;
    if(lbTab === 'total'){
      const g = {};
      rows.forEach(r => {
        const o = g[r.pid] || (g[r.pid] = { pid:r.pid, name:r.name, at:0, score:0, seconds:0, secs:{} });
        if(!o.secs[r.section]){ o.secs[r.section] = 1; o.score += r.score; o.seconds += r.seconds; }
        if(r.at >= o.at){ o.at = r.at; o.name = r.name; }
      });
      list = Object.keys(g).map(k => ({ pid:k, name:g[k].name, score:g[k].score, seconds:g[k].seconds, n:Object.keys(g[k].secs).length }));
    } else {
      list = rows.filter(r => r.section === lbTab).map(r => ({ pid:r.pid, name:r.name, score:r.score, seconds:r.seconds }));
    }
    list.sort((a, b) => (b.score - a.score) || (a.seconds - b.seconds));
    box.textContent = '';
    if(!list.length){
      const p = document.createElement('p'); p.className = 'lbempty';
      p.textContent = 'Personne n\'a encore enregistré de score ici aujourd\'hui. Termine une section pour inscrire ton nom.';
      box.appendChild(p); return;
    }
    const tbl = document.createElement('table'); tbl.className = 'lbtable';
    const hr = tbl.createTHead().insertRow();
    const heads = lbTab === 'total' ? [['#', ''], ['Nom', ''], ['Points', 'r'], ['Sections', 'r'], ['Temps', 'r']] : [['#', ''], ['Nom', ''], ['Points', 'r'], ['Temps', 'r']];
    heads.forEach(h => { const th = document.createElement('th'); th.textContent = h[0]; if(h[1]) th.className = h[1]; hr.appendChild(th); });
    const tb = tbl.createTBody();
    const medal = ['🥇', '🥈', '🥉'];
    list.forEach((r, i) => {
      const tr = tb.insertRow(); if(saved.pid && r.pid === saved.pid) tr.className = 'me';
      const c0 = tr.insertCell(); c0.className = 'rk'; c0.textContent = i < 3 ? medal[i] : String(i + 1);
      tr.insertCell().textContent = r.name;
      const c2 = tr.insertCell(); c2.className = 'r'; c2.textContent = r.score + ' pts';
      if(lbTab === 'total'){ const c = tr.insertCell(); c.className = 'r'; c.textContent = r.n + ' / ' + modules.length; }
      const c3 = tr.insertCell(); c3.className = 'r'; c3.textContent = fmt(r.seconds);
    });
    box.appendChild(tbl);
  }
  document.querySelectorAll('#lbTabs button').forEach(b => b.addEventListener('click', () => { lbTab = b.getAttribute('data-t'); paintRows(); }));
  document.getElementById('lbBack').addEventListener('click', showMenu);
  paintRows(); paintNote();
  if(DB){
    try {
      LB_UNSUB = DB.collection('leaderboard').where('day', '==', DAY).limit(1000).onSnapshot(snap => {
        sharedBoard = true;
        rows = snap.docs.map(d => normRow(d.id, d.data())).filter(r => r.section);
        // Scores non partagés : on les garde visibles (surlignés) pour que l'élève les retrouve
        localRows().forEach(r => { if(r.shared === false && r.pid === saved.pid && !rows.some(x => x.id === r.id)) rows.push(normRow(r.id, r)); });
        paintRows(); paintNote();
      }, () => { sharedBoard = false; rows = localRows().map(r => normRow(r.id, r)); paintRows(); paintNote(); });
    } catch(e) { LB_UNSUB = null; }
  }
}

showMenu();
